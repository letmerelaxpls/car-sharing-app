databaseChangeLog:
  - changeSet:
      id: 04-create-cars-table
      author: letmerelax
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: model
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: brand
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: inventory
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: daily_fee
                  type: decimal
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: bit
                  defaultValue: 0
                  constraints:
                    nullable: false

        - insert:
            tableName: cars
            columns:
              - column:
                  name: model
                  value: Camry
              - column:
                  name: brand
                  value: Toyota
              - column:
                  name: type
                  value: SEDAN
              - column:
                  name: inventory
                  valueNumeric: 5
              - column:
                  name: daily_fee
                  valueNumeric: 80.00
        - insert:
            tableName: cars
            columns:
              - column:
                  name: model
                  value: CR-V
              - column:
                  name: brand
                  value: Honda
              - column:
                  name: type
                  value: SUV
              - column:
                  name: inventory
                  valueNumeric: 3
              - column:
                  name: daily_fee
                  valueNumeric: 95.00
        - insert:
            tableName: cars
            columns:
              - column:
                  name: model
                  value: Golf
              - column:
                  name: brand
                  value: Volkswagen
              - column:
                  name: type
                  value: HATCHBACK
              - column:
                  name: inventory
                  valueNumeric: 7
              - column:
                  name: daily_fee
                  valueNumeric: 70.00
