spring.datasource.url=jdbc:tc:mysql:8.1.0:///car_sharing_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.enabled=true

spring.config.import=optional:file:.env.example[.properties]

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

stripe.secret.key=${STRIPE_SECRET_KEY}
payment.success.url=${PAYMENT_SUCCESS_URL}
payment.cancel.url=${PAYMENT_SUCCESS_URL}

telegrambots.enabled=false
telegrambots.bots[0].username=relaxcarsharing_bot
telegrambots.bots[0].token=${TELEGRAM_BOT_TOKEN}
admin.chat.id=${ADMIN_CHAT_ID}
